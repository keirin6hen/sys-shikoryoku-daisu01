<!DOCTYPE html>
<html lang="ja" xml:lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>システム数学 思考力問題の考え方 - 幾何・統計編</title>
  <link rel="stylesheet" href="main.css">
  <script>
    window.MathJax = { tex: { tags "ams" } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"></script>
  <script src="hint.js"></script>
</head>
<body>
  <header class="page-header">
    <h1 class="page-title">システム数学 思考力問題の考え方</h1>
    <p class="page-subtitle">幾何・統計編</p>
  </header>

  <main>
    <section class="problem-section">
      <div class="problem-frame">
        <img src="./mondaiimg/mondai51.png" alt="問題">
      </div>
    </section>

    <section class="hints-section" aria-label="ヒント">
      <details class="hint">
        <summary class="hint__btn">考え方1</summary>
        <div class="hint__body">
          例えば，点Rを固定して点Qのみ動かすとき，PQ+QRを最小にする点Qを考える。</div>
      </details>

      <details class="hint">
        <summary class="hint__btn">考え方2</summary>
        <div class="hint__body">
          点Pの辺ACに関する対称点を点P<sub>1</sub>とおくと，PQ+QR=P<sub>1</sub>Q+QR<br>
          P<sub>1</sub>と点Rが辺ACに関して反対側にあるので，これを最小にする点QはP<sub>1</sub>Rと辺ACの交点である。<br>
          <figure class="hint-figure">
            <img src="./hintimg/kika01-1.png" alt="対称点の図解">
          </figure>
        </div>
      </details>

      <details class="hint">
        <summary class="hint__btn">考え方3</summary>
        <div class="hint__body">
          点PのACに関する対称点をP<sub>1</sub>，<br>
          点PのABに関する対称点をP<sub>2</sub>とおく。
        </div>
      </details>
    </section>
  </main>
</body>
</html>
